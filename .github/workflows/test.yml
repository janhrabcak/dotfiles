name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly run on Sundays

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ShellCheck
        # We skip ShellCheck for Zsh files because it doesn't support Zsh syntax (SC1071).
        # We rely on 'zsh -n' for these files instead.
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: |
            zsh/plugins/**
            bootstrap.sh
            zsh/.zshrc
            zsh/aliases.zsh

      - name: Zsh Syntax Check
        run: |
          # Ensure Zsh is available for syntax checking
          sudo apt-get update && sudo apt-get install -y zsh
          zsh -n bootstrap.sh
          zsh -n zsh/.zshrc
          zsh -n zsh/aliases.zsh

      - name: Vim Syntax Check
        run: |
          # Use -e (Ex mode) and -s (silent) to avoid hanging
          # Mock home to avoid permission issues
          HOME=$PWD vim -u vim/.vimrc -e -s -c "q"

  test:
    name: Test on ${{ matrix.os }} (${{ matrix.mode }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        mode: [workstation, server]
        exclude:
          - os: ubuntu-latest
            mode: workstation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Environment
        run: |
          # Setup expectations for bootstrap.sh
          mkdir -p ~/.dotfiles
          cp -R . ~/.dotfiles/
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/config
          
          # Initialize dummy Git config to prevent setup_git failures
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: Dry Run Validation
        run: |
          zsh ./bootstrap.sh --mode ${{ matrix.mode }} --dry-run

      - name: Run Bootstrap
        run: zsh ./bootstrap.sh --mode ${{ matrix.mode }} --test

      - name: Verify Post-Install State
        run: |
          [ -L ~/.zshrc ] || exit 1
          [ -L ~/.vimrc ] || exit 1
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            defaults read com.apple.finder AppleShowAllExtensions | grep "1"
          fi
