name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly run on Sundays

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Zsh Syntax Check
        run: |
          # Ensure Zsh is available for syntax checking
          sudo apt-get update && sudo apt-get install -y zsh
          zsh -n dot.sh
          zsh -n zsh/.zshrc
          zsh -n zsh/aliases.zsh

      - name: Vim Syntax Check
        run: |
          # Use -e (Ex mode) and -s (silent) to avoid hanging
          # Mock home to avoid permission issues
          HOME=$PWD vim -u vim/.vimrc -e -s -c "q"

  test:
    name: Test on ${{ matrix.os }} (${{ matrix.mode }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        mode: [macos, linux-client, linux-server]
        exclude:
          - os: ubuntu-latest
            mode: macos
          - os: macos-latest
            mode: linux-client
          - os: macos-latest
            mode: linux-server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Environment
        run: |
          # Install zsh on Linux runners
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update && sudo apt-get install -y zsh
          fi

          # Setup expectations for dot.sh
          mkdir -p ~/.dotfiles
          cp -R . ~/.dotfiles/
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/config
          
          # Initialize dummy Git config to prevent setup_git failures
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: Dry Run Validation
        run: |
          zsh ./dot.sh --mode ${{ matrix.mode }} --dry-run

      - name: Run Bootstrap
        run: zsh ./dot.sh --mode ${{ matrix.mode }} --test

      - name: Verify Post-Install State
        run: |
          [ -L ~/.zshrc ] || exit 1
          [ -L ~/.vimrc ] || exit 1
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            defaults read com.apple.finder AppleShowAllExtensions | grep "1"
          fi
