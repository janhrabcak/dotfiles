# ==============================================================================
# TMUX CONFIGURATION
# ==============================================================================

# --- General Settings ---
# Set colors and true color support
set-option -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Ensure iTerm2 and SSH variables are passed through
set-option -g update-environment "ITERM_SESSION_ID ITERM_PROFILE_NAME SSH_AUTH_SOCK"

# No delay for escape key press
set -sg escape-time 0

# Mouse support
set -g mouse on

# Scrollback
set-option -g history-limit 100000

# Window titles (Disabled for iTerm2 Control Mode compatibility)
set-option -g set-titles off
set-window-option -g automatic-rename on
set-option -g allow-rename on

# Activity monitoring
setw -g monitor-activity off
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-option -g bell-action none

# --- Key Bindings ---
# Set XTerm key bindings
set-window-option -g xterm-keys on

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message "Configuration reloaded"

# Clear history
bind -n C-k clear-history

# Split panes using | and - (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows using Shift-arrow without prefix
bind -n S-Left  previous-window
bind -n S-Right next-window

# --- Vi Copy Mode ---
set-window-option -g mode-keys vi
bind P paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle

# --- UI & Design ---
# Panes
set -g pane-border-style bg=colour235,fg=colour238
set -g pane-active-border-style bg=colour236,fg=colour251

# Status Bar Configuration
set -g status-position bottom
set -g status-justify left
set -g status-interval 2
set -g status-style dim,bg=colour234,fg=colour137

# Status Left & Right
set -g status-left ''
set -g status-left-length 20
set -g status-right '#[fg=colour231,bg=colour208,bold] #S #I:#P #[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50

# Window Status
setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-bell-style fg=colour255,bg=colour1,bold

# Messages
set -g message-style fg=colour232,bg=colour166,bold
set -g message-command-style fg=blue,bg=yellow
setw -g mode-style bg=colour238,fg=colour196,bold
setw -g clock-mode-colour colour135

# --- SSH Environment ---
# Maintain stable ssh agent socket
set-environment -g 'SSH_AUTH_SOCK' "$HOME/.ssh/ssh_auth_sock"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @resurrect-save-shell-history 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# --- Mouse & Copy Mode UX Improvements ---
# Don't exit copy mode after dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Scroll 3 lines at a time instead of 1
set -g @scroll-speed-num-lines-per-scroll 3

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Redirecting to a log file is CRITICAL for iTerm2 Control Mode stability
run '~/.tmux/plugins/tpm/tpm > ~/.tmux/tpm.log 2>&1'

# Disable aggressive-resize for iTerm2 Control Mode compatibility
set-window-option -g aggressive-resize off
