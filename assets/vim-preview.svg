<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <clipPath id="window-clip">
      <rect width="850" height="360" rx="10" ry="10" />
    </clipPath>
    <style>
      .bg { fill: #002b36; }
      .header { fill: #073642; }
      .title { fill: #839496; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 13.5px; }
      .lineno { fill: #586e75; text-anchor: end; }
      .lineno-cur { fill: #93a1a1; font-weight: bold; text-anchor: end; }
      .keyword { fill: #859900; font-weight: bold; }
      .ident { fill: #268bd2; }
      .string { fill: #2aa198; }
      .punct { fill: #93a1a1; }
      .tilde { fill: #586e75; opacity: 0.45; }
      .bar-bg { fill: #073642; }
      .bar-normal { fill: #859900; }
      .bar-branch { fill: #586e75; }
      .bar-normal-text { fill: #002b36; font-weight: bold; font-size: 12px; }
      .bar-branch-text { fill: #fdf6e3; font-size: 12px; font-weight: 600; }
      .bar-mid-text { fill: #93a1a1; font-size: 12px; }
      .bar-right-text { fill: #839496; font-size: 12px; }
      .cursor { fill: #2aa198; opacity: 0.45; }
    </style>
    <g id="git-icon-light">
      <path d="M2,2 L2,12 M2,8 C2,6 6,6 6,4" stroke="#fdf6e3" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <circle cx="2" cy="2.5" r="1.6" fill="#fdf6e3" />
      <circle cx="2" cy="11.5" r="1.6" fill="#fdf6e3" />
      <circle cx="6" cy="3.5" r="1.6" fill="#fdf6e3" />
    </g>
  </defs>

  <g clip-path="url(#window-clip)">
    <!-- Window Background -->
    <rect width="850" height="360" class="bg" />

    <!-- Window Titlebar -->
    <rect width="850" height="38" class="header" />
    <circle cx="22" cy="19" r="6" fill="#ff5f56" />
    <circle cx="42" cy="19" r="6" fill="#ffbd2e" />
    <circle cx="62" cy="19" r="6" fill="#27c93f" />
    <text x="425" y="24" class="title">main.go — ~/.dotfiles (vim)</text>

    <!-- Code Buffer (Hybrid Relative Line Numbers: set number + set relativenumber, cursor at line 8:1) -->
    <g class="code-text" transform="translate(0, 66)">
      <!-- Line 1 (rel 7) -->
      <text x="42" y="0" class="lineno">7</text>
      <text x="65" y="0"><tspan class="keyword">package</tspan> <tspan class="ident">main</tspan></text>

      <!-- Line 2 (rel 6) -->
      <text x="42" y="25" class="lineno">6</text>

      <!-- Line 3 (rel 5) -->
      <text x="42" y="50" class="lineno">5</text>
      <text x="65" y="50"><tspan class="keyword">import</tspan> <tspan class="punct">(</tspan></text>

      <!-- Line 4 (rel 4) -->
      <text x="42" y="75" class="lineno">4</text>
      <text x="95" y="75"><tspan class="string">"fmt"</tspan></text>

      <!-- Line 5 (rel 3) -->
      <text x="42" y="100" class="lineno">3</text>
      <text x="65" y="100"><tspan class="punct">)</tspan></text>

      <!-- Line 6 (rel 2) -->
      <text x="42" y="125" class="lineno">2</text>

      <!-- Line 7 (rel 1) -->
      <text x="42" y="150" class="lineno">1</text>
      <text x="65" y="150"><tspan class="keyword">func</tspan> <tspan class="ident">main</tspan><tspan class="punct">() {</tspan></text>

      <!-- Line 8 (Active Cursor Line: absolute line number 8) -->
      <rect x="0" y="161" width="850" height="22" fill="#073642" opacity="0.55" />
      <rect x="95" y="163" width="8.5" height="17" class="cursor" />
      <text x="30" y="175" class="lineno-cur">8</text>
      <text x="95" y="175"><tspan class="ident">fmt</tspan><tspan class="punct">.</tspan><tspan class="ident">Println</tspan><tspan class="punct">(</tspan><tspan class="string">"✨ Dotfiles verified &amp; operational!"</tspan><tspan class="punct">)</tspan></text>

      <!-- Line 9 (rel 1) -->
      <text x="42" y="200" class="lineno">1</text>
      <text x="65" y="200"><tspan class="punct">}</tspan></text>

      <!-- Empty buffer tilde -->
      <text x="22" y="225" class="tilde">~</text>
    </g>

    <!-- Lightline Statusline (laststatus=2, solarized, gitbranch + filename) -->
    <g transform="translate(0, 310)">
      <rect width="850" height="24" class="bar-bg" />

      <!-- Mode segment: NORMAL -->
      <rect x="0" y="0" width="78" height="24" class="bar-normal" />
      <text x="13" y="16" class="bar-normal-text code-text">NORMAL</text>

      <!-- Gitbranch segment (FugitiveHead): main -->
      <rect x="78" y="0" width="74" height="24" class="bar-branch" />
      <polygon points="78,0 88,12 78,24" class="bar-normal" />
      <use href="#git-icon-light" x="95" y="5" />
      <text x="107" y="16" class="bar-branch-text code-text">main</text>
      <polygon points="152,0 162,12 152,24" class="bar-branch" />

      <!-- Filename segment: main.go -->
      <text x="174" y="16" class="bar-mid-text code-text">main.go</text>

      <!-- Right segments: fileencoding | fileformat | filetype -->
      <text x="580" y="16" class="bar-right-text code-text">utf-8 | unix | go</text>

      <!-- Percent segment -->
      <polygon points="722,12 732,0 732,24" class="bar-branch" />
      <rect x="732" y="0" width="54" height="24" class="bar-branch" />
      <text x="742" y="16" class="bar-branch-text code-text">88%</text>

      <!-- Line:Col segment -->
      <polygon points="786,12 796,0 796,24" class="bar-normal" />
      <rect x="796" y="0" width="54" height="24" class="bar-normal" />
      <text x="808" y="16" class="bar-normal-text code-text">8:1</text>
    </g>

    <!-- Bottom Ex Command Line (noshowmode) -->
    <text x="14" y="350" class="code-text bar-right-text">"main.go" 9L, 118B</text>
  </g>

  <!-- Subtle Outer Frame Border -->
  <rect width="849" height="359" x="0.5" y="0.5" rx="10" ry="10" fill="none" stroke="#586e75" stroke-opacity="0.35" />
</svg>
