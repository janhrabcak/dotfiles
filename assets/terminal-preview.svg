<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #002b36; }
      .header { fill: #073642; }
      .title { fill: #839496; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .terminal-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 13.5px; line-height: 1.5; }
      .prompt-user { fill: #b58900; font-weight: bold; }
      .prompt-host-g1 { fill: #268bd2; font-weight: bold; }
      .prompt-host-g2 { fill: #dc322f; font-weight: bold; }
      .prompt-host-g3 { fill: #b58900; font-weight: bold; }
      .prompt-host-g4 { fill: #268bd2; font-weight: bold; }
      .prompt-host-g5 { fill: #859900; font-weight: bold; }
      .prompt-host-g6 { fill: #dc322f; font-weight: bold; }
      .prompt-dir { fill: #268bd2; }
      .prompt-git { fill: #859900; font-weight: bold; }
      .prompt-dirty { fill: #b58900; }
      .cmd { fill: #fdf6e3; font-weight: 600; }
      .txt-info { fill: #268bd2; }
      .txt-ok { fill: #859900; }
      .txt-mute { fill: #586e75; }
      .txt-white { fill: #93a1a1; }
      .txt-cyan { fill: #2aa198; }
      .cursor { fill: #2aa198; animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="850" height="460" rx="10" ry="10" class="bg" />
  
  <!-- Window Titlebar -->
  <path d="M 0,10 C 0,4.48 4.48,0 10,0 L 840,0 C 845.52,0 850,4.48 850,10 L 850,38 L 0,38 Z" class="header" />
  
  <!-- Window Controls (Traffic Lights) -->
  <circle cx="22" cy="19" r="6" fill="#ff5f56" />
  <circle cx="42" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="19" r="6" fill="#27c93f" />
  
  <!-- Window Title -->
  <text x="425" y="24" class="title">jh@workstation: ~/.dotfiles (zsh)</text>

  <!-- Terminal Content -->
  <g class="terminal-text" transform="translate(25, 68)">
    <!-- Line 1: Prompt & Command -->
    <text y="0">
      <tspan class="prompt-user">jh@</tspan><tspan class="prompt-host-g1">g</tspan><tspan class="prompt-host-g2">o</tspan><tspan class="prompt-host-g3">o</tspan><tspan class="prompt-host-g4">g</tspan><tspan class="prompt-host-g5">l</tspan><tspan class="prompt-host-g6">e</tspan>
      <tspan class="txt-mute">:</tspan>
      <tspan class="prompt-dir">~/.dotfiles</tspan>
      <tspan class="txt-mute"> (</tspan><tspan class="prompt-git">git:main</tspan> <tspan class="prompt-dirty">✚±</tspan><tspan class="txt-mute">)</tspan>
      <tspan class="txt-white"> $ </tspan>
      <tspan class="cmd">./dot.sh --doctor</tspan>
    </text>

    <!-- Line 2: Diagnostic Banner -->
    <text y="28">
      <tspan class="txt-info">[INFO]</tspan>
      <tspan class="txt-white">  🩺 Starting Dotfiles Diagnostic...</tspan>
    </text>

    <!-- Line 3-8: Verified Links -->
    <text y="54">
      <tspan class="txt-ok">[OK]</tspan>
      <tspan class="txt-white">    Link OK: .zshrc  &#8594; ~/.dotfiles/config/zsh/.zshrc</tspan>
    </text>
    <text y="78">
      <tspan class="txt-ok">[OK]</tspan>
      <tspan class="txt-white">    Link OK: .vimrc  &#8594; ~/.dotfiles/config/vim/.vimrc</tspan>
    </text>
    <text y="102">
      <tspan class="txt-ok">[OK]</tspan>
      <tspan class="txt-white">    Link OK: .tmux.conf  &#8594; ~/.dotfiles/config/tmux/.tmux.conf</tspan>
    </text>
    <text y="126">
      <tspan class="txt-ok">[OK]</tspan>
      <tspan class="txt-white">    Link OK: .gitignore_global  &#8594; ~/.dotfiles/config/git/.gitignore_global</tspan>
    </text>
    <text y="150">
      <tspan class="txt-ok">[OK]</tspan>
      <tspan class="txt-white">    Link OK: GEMINI.md &amp; CLAUDE.md (AI Developer Guidelines)</tspan>
    </text>
    <text y="174">
      <tspan class="txt-ok">[OK]</tspan>
      <tspan class="txt-white">    Link OK: settings.json (Hardened Command Whitelist)</tspan>
    </text>
    <text y="198">
      <tspan class="txt-ok">[OK]</tspan>
      <tspan class="txt-white">    Git: Include directive active in ~/.gitconfig</tspan>
    </text>
    <text y="222">
      <tspan class="txt-ok">[OK]</tspan>
      <tspan class="txt-white">    SSH: Platform include active in ~/.ssh/config (chmod 600)</tspan>
    </text>

    <!-- Line 9: Diagnostic Success -->
    <text y="254">
      <tspan class="txt-ok">[OK]</tspan>
      <tspan class="txt-cyan" font-weight="bold">    ✨ All systems operational! 52 automated tests passing.</tspan>
    </text>

    <!-- Line 10: Next Prompt Ready -->
    <text y="294">
      <tspan class="prompt-user">jh@</tspan><tspan class="prompt-host-g1">g</tspan><tspan class="prompt-host-g2">o</tspan><tspan class="prompt-host-g3">o</tspan><tspan class="prompt-host-g4">g</tspan><tspan class="prompt-host-g5">l</tspan><tspan class="prompt-host-g6">e</tspan>
      <tspan class="txt-mute">:</tspan>
      <tspan class="prompt-dir">~/.dotfiles</tspan>
      <tspan class="txt-mute"> (</tspan><tspan class="prompt-git">git:main</tspan><tspan class="txt-mute">)</tspan>
      <tspan class="txt-white"> $ </tspan>
      <tspan class="cursor">&#x2588;</tspan>
    </text>
  </g>
</svg>
